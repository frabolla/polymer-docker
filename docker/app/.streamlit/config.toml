# Streamlit configuration for the Polymer interface.
# Picked up because the entrypoint runs `streamlit run` from /app.

[theme]
base = "light"
primaryColor = "#2E7D9A"          # calm ocean blue-teal
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F7"
textColor = "#1E2A32"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[server]
headless = true
fileWatcherType = "none"
# Allow uploading single-file products (PRISMA .he5, MODIS .L1C) through the
# browser. Big folder products (.SEN3 / .SAFE) should still be copied into
# data/input directly — a multi-GB browser upload is impractical.
maxUploadSize = 2048
