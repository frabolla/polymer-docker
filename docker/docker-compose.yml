# Run Polymer with a graphical interface.
#
# First time (builds the image, 10-20 minutes):
#   docker compose -f docker/docker-compose.yml up --build
# Next times:
#   docker compose -f docker/docker-compose.yml up
# Then open the browser at http://localhost:8501
#
# The data lives in the ./data folder next to the repository:
#   data/input      -> put your Level-1 satellite products here
#   data/output     -> the Level-2 results appear here
#   data/auxdata    -> Polymer static data (downloaded once)
#   data/ancillary  -> meteorological data downloaded automatically
#   data/config     -> credentials saved by the interface

name: polymer

services:
  polymer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: polymer-gui:local
    platform: linux/amd64
    container_name: polymer-gui
    ports:
      - "8501:8501"
    volumes:
      - ../data/input:/data/input
      - ../data/output:/data/output
      - ../data/auxdata:/data/auxdata
      - ../data/ancillary:/data/ancillary
      - ../data/config:/data/config
    shm_size: "2gb"
    restart: "no"
