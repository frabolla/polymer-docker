# Verify that the Polymer Docker image builds correctly.
# It does NOT publish any image: Polymer's licence forbids redistribution.
#
# linux/amd64 is built on every push (native, ~15-20 min).
# linux/arm64 is emulated via QEMU (~1 h), so it only runs on pull requests and
# on a manual "Run workflow" (workflow_dispatch) — enough to catch breakage in
# docker/environment.arm64.yml without slowing every push.
name: docker-build

on:
  push:
    paths:
      - "docker/**"
      - "environment.yml"
      - "VERSION"
      - "polymer/**"
      - "meson.build"
      - "makefile"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "docker/**"
      - "environment.yml"
      - "VERSION"
      - "polymer/**"
      - "meson.build"
      - "makefile"
  workflow_dispatch:

# Only keep the latest run per branch; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # amd64 always; add arm64 only on pull_request / workflow_dispatch.
        platform: ${{ github.event_name == 'push' && fromJSON('["linux/amd64"]') || fromJSON('["linux/amd64","linux/arm64"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.platform }}, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: polymer-gui:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test - compiled modules and app modules importable
        run: |
          docker run --rm --platform ${{ matrix.platform }} polymer-gui:ci \
            micromamba run -n polymer python -c "import polymer.polymer_main, polymer.water; from polymer.main import run_atm_corr; print('Polymer OK')"
          docker run --rm --platform ${{ matrix.platform }} --entrypoint bash polymer-gui:ci -lc \
            "micromamba run -n polymer python -c 'import ast; [ast.parse(open(f).read()) for f in [\"/app/streamlit_app.py\",\"/app/polymer_job.py\",\"/app/job_runner.py\",\"/app/uploads.py\",\"/app/quicklook.py\",\"/app/i18n.py\",\"/app/credentials.py\",\"/app/setup_status.py\",\"/app/params_schema.py\"]]; print(\"app OK\")'"
