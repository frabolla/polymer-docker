# Verify that the Polymer interface tests pass and the Docker image builds.
# It does NOT publish any image: Polymer's licence forbids redistribution.
#
# Both architectures build on native runners (amd64 and arm64), so each leg is
# fast enough to run on every push.
name: docker-build

on:
  push:
    paths:
      - "docker/**"
      - "environment.yml"
      - "VERSION"
      - "polymer/**"
      - "meson.build"
      - "makefile"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "docker/**"
      - "environment.yml"
      - "VERSION"
      - "polymer/**"
      - "meson.build"
      - "makefile"
  workflow_dispatch:

# Keep only the latest run per branch; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy
      - run: pytest docker/tests -q

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.platform }}, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: polymer-gui:ci
          build-args: |
            POLYMER_GUI_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test - Polymer imports, app modules parse
        run: |
          docker run --rm polymer-gui:ci \
            micromamba run -n polymer python -c "import polymer.polymer_main, polymer.water; from polymer.main import run_atm_corr; print('Polymer OK')"
          docker run --rm --entrypoint bash polymer-gui:ci -lc \
            "cd /app && micromamba run -n polymer python -c 'import ast, glob; [ast.parse(open(f).read()) for f in glob.glob(\"*.py\")]; print(\"app OK\")'"
